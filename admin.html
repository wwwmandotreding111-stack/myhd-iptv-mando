<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة | MYHD IPTV MANDO</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="admin-page"><header class="admin-top"><a class="brand" href="index.html"><span class="brand-mark">M</span><span>MYHD <b>IPTV</b><small>ADMIN</small></span></a><span class="admin-label">لوحة التحكم</span></header>
<main class="admin-wrap"><section id="adminLogin" class="auth-card"><span class="eyebrow">دخول آمن</span><h1>تسجيل دخول الإدارة</h1><label>البريد الإلكتروني</label><input id="adminEmail" type="email"><label>كلمة المرور</label><input id="adminPassword" type="password"><button class="btn btn-gold full" id="adminLoginBtn">دخول</button><p id="adminMessage" class="message"></p></section>
<section id="dashboard" hidden><div class="dash-head"><div><span class="eyebrow">نظرة عامة</span><h1>مرحباً بك في الإدارة</h1></div><button class="btn btn-outline" id="adminLogout">تسجيل الخروج</button></div>
<div class="stats"><article><small>الباقات النشطة</small><b id="statPlans">—</b></article><article><small>طلبات الاشتراك</small><b id="statOrders">—</b></article><article><small>طلبات جديدة</small><b id="statPending">—</b></article></div>
<div class="admin-grid"><section class="panel"><div class="panel-head"><h2>إدارة الباقات</h2><button class="btn btn-gold" id="newPlanBtn">+ إضافة باقة</button></div>
<form id="planForm" hidden><input type="hidden" id="planId"><label>اسم الباقة</label><input id="planName" required><label>التصنيف</label><input id="planCategory" placeholder="MY HD أو MY HD VIP"><div class="two"><div><label>السعر</label><input id="planPrice" type="number" min="0" step="0.01" required></div><div><label>العملة</label><input id="planCurrency" value="USD" required></div></div><div class="two"><div><label>المدة بالأشهر</label><input id="planMonths" type="number" min="1"></div><div><label>المدة بالساعات (للتجربة)</label><input id="planHours" type="number" min="1"></div></div><label>رابط صورة البطاقة</label><input id="planImage" type="url" placeholder="https://..."><label>الوصف</label><textarea id="planDescription" rows="2"></textarea><label class="check"><input id="planActive" type="checkbox" checked> باقة ظاهرة بالموقع</label><div class="auth-actions"><button class="btn btn-gold" type="submit">حفظ الباقة</button><button class="btn btn-outline" type="button" id="cancelPlan">إلغاء</button></div></form>
<div id="adminPlans" class="admin-list"></div></section><section class="panel"><h2>طلبات الاشتراك</h2><div id="ordersList" class="admin-list">لا توجد بيانات بعد.</div></section></div><p id="dashboardMessage" class="message"></p></section></main>
<script src="config.js"></script><script src="admin.js"></script></body></html>
