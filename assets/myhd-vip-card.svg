<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <!-- خلفية سوداء مطفية فخمة -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    
    <!-- تدرجات ذهبية لامعة (Gold Foil) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C3"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFDF73"/>
      <stop offset="75%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8A5A00"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A5A00"/>
    </linearGradient>

    <!-- تدرج نصي ذهبي معدني -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FCEABB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#5A3A00"/>
    </linearGradient>

    <!-- ظلال وتوهج ذهبي -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- الخلفية -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- خطوط ضوئية ذهبية بالخلفية -->
  <path d="M 500 0 L 900 400 M 600 0 L 900 300 M 700 0 L 900 200" stroke="#D4AF37" stroke-width="2" opacity="0.15"/>
  <circle cx="450" cy="300" r="350" fill="#D4AF37" opacity="0.05"/>

  <!-- ================= الجزء الأيسر: الشعار والنصوص ================= -->
  <g transform="translate(40, 30)">
    <!-- الشعار (الزهرة الذهبية الفخمة) -->
    <g transform="translate(60, 30) scale(0.8)">
      <path d="M 0 -40 Q 25 -70 40 -40 Q 25 -10 0 -10 Z" fill="url(#goldGrad)"/>
      <path d="M 0 -40 Q -25 -70 -40 -40 Q -25 -10 0 -10 Z" fill="url(#goldDark)"/>
      <path d="M 35 -25 Q 65 -25 55 0 Q 35 10 20 -5 Z" fill="url(#goldGrad)"/>
      <path d="M -35 -25 Q -65 -25 -55 0 Q -35 10 -20 -5 Z" fill="url(#goldDark)"/>
      <path d="M 25 20 Q 50 50 20 65 Q 0 40 0 25 Z" fill="url(#goldGrad)"/>
      <path d="M -25 20 Q -50 50 -20 65 Q 0 40 0 25 Z" fill="url(#goldDark)"/>
      <path d="M -15 35 Q -15 65 15 55 Q 20 35 5 20 Z" fill="url(#goldGrad)"/>
    </g>

    <!-- نص MY HD VIP -->
    <text x="60" y="110" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="45" fill="url(#goldText)" text-anchor="middle" letter-spacing="2" filter="url(#glowGold)">MY HD VIP</text>

    <!-- النص العربي الرئيسي -->
    <text x="0" y="170" font-family="Tahoma, Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="start">متعة المشاهدة</text>
    <text x="0" y="205" font-family="Tahoma, Arial, sans-serif" font-weight="900" font-size="28" fill="url(#goldText)" text-anchor="start">بجودة لا تضاهى</text>

    <!-- المربعات الأربعة (الميزات) -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="240" height="45" rx="8" fill="#0a0a0a" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <rect x="12" y="10" width="22" height="18" rx="3" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
      <path d="M 16 7 L 30 7 M 18 30 L 28 30" stroke="url(#goldGrad)" stroke-width="2"/>
      <text x="50" y="18" font-family="Tahoma" font-weight="bold" font-size="12" fill="#fff">قنوات متنوعة</text>
      <text x="50" y="34" font-family="Tahoma" font-size="9" fill="#D4AF37">محلية وعالمية</text>
    </g>

    <g transform="translate(0, 285)">
      <rect x="0" y="0" width="240" height="45" rx="8" fill="#0a0a0a" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <rect x="12" y="10" width="22" height="18" rx="3" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
      <text x="16" y="24" font-family="Arial" font-size="9" font-weight="bold" fill="url(#goldGrad)">HD</text>
      <text x="50" y="18" font-family="Tahoma" font-weight="bold" font-size="12" fill="#fff">جودة عالية</text>
      <text x="50" y="34" font-family="Tahoma" font-size="9" fill="#D4AF37">صوت وصورة فائقة</text>
    </g>

    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="240" height="45" rx="8" fill="#0a0a0a" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <circle cx="22" cy="22" r="9" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
      <path d="M 19 18 L 26 22 L 19 26 Z" fill="url(#goldGrad)"/>
      <text x="50" y="18" font-family="Tahoma" font-weight="bold" font-size="12" fill="#fff">محتوى مميز</text>
      <text x="50" y="34" font-family="Tahoma" font-size="9" fill="#D4AF37">أفلام، مسلسلات، برامج</text>
    </g>

    <g transform="translate(0, 395)">
      <rect x="0" y="0" width="240" height="45" rx="8" fill="#0a0a0a" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <rect x="12" y="10" width="10" height="18" rx="2" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <rect x="18" y="18" width="8" height="10" rx="2" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <text x="50" y="18" font-family="Tahoma" font-weight="bold" font-size="12" fill="#fff">متوافق مع جميع الأجهزة</text>
      <text x="50" y="34" font-family="Tahoma" font-size="9" fill="#D4AF37">Android - iOS - Smart TV</text>
    </g>
  </g>

  <!-- ================= الجزء الأيمن: التلفاز والرسيفر ================= -->
  <g transform="translate(300, 30)" filter="url(#boxShadow)">
    <!-- إطار التلفاز الذهبي -->
    <rect x="0" y="0" width="560" height="360" rx="10" fill="#0a0a0a" stroke="url(#goldGrad)" stroke-width="5"/>
    
    <!-- شاشة التلفاز -->
    <rect x="5" y="5" width="550" height="350" fill="#050505"/>
    
    <!-- شريط القوائم -->
    <rect x="5" y="5" width="550" height="35" fill="#111"/>
    <text x="230" y="26" font-family="Tahoma" font-size="14" fill="#D4AF37">برامج   مسلسلات   أفلام   مباشر</text>
    <circle cx="520" cy="22" r="7" fill="none" stroke="#D4AF37" stroke-width="2"/>
    
    <!-- محتوى الشاشة (بطاقات ذهبية) -->
    <rect x="15" y="50" width="120" height="230" rx="8" fill="#111" stroke="#D4AF37" stroke-width="1"/>
    <text x="75" y="170" font-family="Tahoma" font-size="16" fill="#D4AF37" text-anchor="middle">LIVE TV</text>
    
    <rect x="150" y="50" width="120" height="230" rx="8" fill="#111" stroke="#D4AF37" stroke-width="1"/>
    <text x="210" y="170" font-family="Tahoma" font-size="16" fill="#D4AF37" text-anchor="middle">مسلسلات</text>
    
    <rect x="285" y="50" width="120" height="230" rx="8" fill="#111" stroke="#D4AF37" stroke-width="1"/>
    <text x="345" y="170" font-family="Tahoma" font-size="16" fill="#D4AF37" text-anchor="middle">أفلام</text>
    
    <rect x="420" y="50" width="120" height="230" rx="8" fill="#111" stroke="#D4AF37" stroke-width="1"/>
    <text x="480" y="170" font-family="Tahoma" font-size="16" fill="#D4AF37" text-anchor="middle">برامج</text>

    <!-- حامل التلفاز -->
    <path d="M 210 360 L 190 390 L 370 390 L 350 360 Z" fill="#111"/>

    <!-- الرسيفر الذهبي -->
    <rect x="50" y="410" width="320" height="70" rx="8" fill="#0a0a0a" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="210" y="455" font-family="Arial" font-weight="bold" font-size="26" fill="url(#goldText)" text-anchor="middle">MY HD</text>
    <circle cx="340" cy="460" r="4" fill="#D4AF37" filter="url(#glowGold)"/>

    <!-- الريموت -->
    <rect x="400" y="380" width="40" height="120" rx="8" fill="#0a0a0a" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="420" cy="400" r="6" fill="#B8860B"/>
    <circle cx="420" cy="425" r="9" fill="#333"/>
  </g>

  <!-- ================= الجزء السفلي: التواصل والاشتراك ================= -->
  
  <!-- مربع التواصل -->
  <g transform="translate(40, 480)">
    <rect x="0" y="0" width="380" height="80" rx="15" fill="#0a0a0a" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="40" cy="40" r="25" fill="url(#goldGrad)"/>
    <path d="M 32 28 Q 40 24 44 32 L 40 36 Q 36 32 32 36 Z" fill="#0a0a0a"/>
    <path d="M 36 44 Q 44 48 48 40 L 44 36 Q 40 40 36 36 Z" fill="#0a0a0a"/>
    
    <text x="80" y="30" font-family="Tahoma" font-size="14" fill="#D4AF37">تواصل معنا</text>
    <text x="80" y="55" font-family="Arial" font-weight="bold" font-size="24" fill="#fff">+963991936353</text>
  </g>

  <!-- زر الاشتراك (اشترك الآن) -->
  <g transform="translate(440, 480)">
    <rect x="0" y="0" width="420" height="80" rx="15" fill="url(#goldGrad)" filter="url(#glowGold)"/>
    <text x="180" y="50" font-family="Tahoma" font-weight="bold" font-size="30" fill="#0a0a0a" text-anchor="middle">اشترك الآن</text>
    <path d="M 360 30 L 380 40 L 360 50 Z" fill="#0a0a0a"/>
  </g>

  <!-- ================= الميزات الصغيرة (الجزء السفلي) ================= -->
  <g transform="translate(40, 570)">
    <rect x="0" y="0" width="820" height="25" rx="5" fill="#0a0a0a" stroke="url(#goldGrad)" stroke-width="1"/>
    
    <g transform="translate(30, 2)">
      <path d="M 8 2 L 16 0 L 24 2 L 24 12 Q 16 20 8 12 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <text x="32" y="10" font-family="Tahoma" font-weight="bold" font-size="9" fill="#fff">خدمة موثوقة</text>
      <text x="32" y="20" font-family="Tahoma" font-size="7" fill="#D4AF37">ودعم مستمر</text>
    </g>
    
    <line x1="160" y1="4" x2="160" y2="21" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>

    <g transform="translate(180, 2)">
      <path d="M 8 12 L 8 5 Q 8 0 16 0 Q 24 0 24 5 L 24 12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <rect x="5" y="8" width="6" height="8" rx="2" fill="url(#goldGrad)"/>
      <rect x="21" y="8" width="6" height="8" rx="2" fill="url(#goldGrad)"/>
      <text x="32" y="10" font-family="Tahoma" font-weight="bold" font-size="9" fill="#fff">دعم فني</text>
      <text x="32" y="20" font-family="Tahoma" font-size="7" fill="#D4AF37">على مدار الساعة</text>
    </g>

    <line x1="310" y1="4" x2="310" y2="21" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>

    <g transform="translate(330, 2)">
      <path d="M 12 2 L 16 8 L 12 14 L 14 8 Z" fill="url(#goldGrad)"/>
      <path d="M 20 2 L 16 8 L 20 14 L 18 8 Z" fill="url(#goldGrad)"/>
      <text x="28" y="10" font-family="Tahoma" font-weight="bold" font-size="9" fill="#fff">تحديثات مستمرة</text>
      <text x="28" y="20" font-family="Tahoma" font-size="7" fill="#D4AF37">وأداء مستقر</text>
    </g>

    <line x1="460" y1="4" x2="460" y2="21" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>

    <g transform="translate(480, 2)">
      <circle cx="10" cy="10" r="6" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <circle cx="20" cy="10" r="6" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <circle cx="15" cy="5" r="5" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <text x="32" y="10" font-family="Tahoma" font-weight="bold" font-size="9" fill="#fff">آلاف</text>
      <text x="32" y="20" font-family="Tahoma" font-size="7" fill="#D4AF37">المشتركين</text>
    </g>
  </g>
</svg>
