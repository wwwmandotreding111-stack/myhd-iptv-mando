<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي | MYHD IPTV MANDO</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="auth-page"><a class="brand auth-brand" href="index.html"><span class="brand-mark">M</span><span>MYHD <b>IPTV</b><small>MANDO</small></span></a>
<main class="auth-card"><span class="eyebrow">منطقة العملاء</span><h1>حسابي</h1><p class="muted">سجّل الدخول لمتابعة طلباتك واشتراكاتك.</p>
<div id="authForms"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور">
<div class="auth-actions"><button class="btn btn-gold" id="loginBtn">تسجيل الدخول</button><button class="btn btn-outline" id="signupBtn">إنشاء حساب</button></div></div>
<div id="accountState" hidden><h3 id="welcome"></h3><p id="accountInfo" class="muted"></p><button class="btn btn-outline" id="logoutBtn">تسجيل الخروج</button></div>
<p id="authMessage" class="message" role="status"></p><a class="back-link" href="index.html">العودة إلى الموقع</a></main>
<script src="config.js"></script><script src="account.js"></script></body></html>
