<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <!-- تدرجات الخلفية -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0514"/>
      <stop offset="50%" stop-color="#160a2b"/>
      <stop offset="100%" stop-color="#05010a"/>
    </linearGradient>
    
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#FF1493"/>
    </linearGradient>

    <linearGradient id="pinkRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1493"/>
      <stop offset="100%" stop-color="#FF0000"/>
    </linearGradient>

    <linearGradient id="bluePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0000FF"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>

    <linearGradient id="logoText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B0082"/>
      <stop offset="50%" stop-color="#DA70D6"/>
      <stop offset="100%" stop-color="#FF1493"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FF1493" flood-opacity="0.5"/>
    </filter>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- الخلفية -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <path d="M 600 0 L 1000 400 M 700 0 L 1000 300 M 800 0 L 1000 200" stroke="#FF1493" stroke-width="2" opacity="0.1"/>
  <circle cx="500" cy="400" r="400" fill="#8A2BE2" opacity="0.1"/>

  <!-- ================= الجزء العلوي الأيسر: الشعار والنصوص ================= -->
  <g transform="translate(40, 50)">
    <!-- الشعار -->
    <g transform="translate(60, 40)">
      <path d="M 0 -40 Q 25 -70 40 -40 Q 25 -10 0 -10 Z" fill="url(#purplePink)"/>
      <path d="M 0 -40 Q -25 -70 -40 -40 Q -25 -10 0 -10 Z" fill="url(#bluePurple)"/>
      <path d="M 35 -25 Q 65 -25 55 0 Q 35 10 20 -5 Z" fill="url(#purplePink)"/>
      <path d="M -35 -25 Q -65 -25 -55 0 Q -35 10 -20 -5 Z" fill="url(#bluePurple)"/>
      <path d="M 25 20 Q 50 50 20 65 Q 0 40 0 25 Z" fill="url(#pinkRed)"/>
      <path d="M -25 20 Q -50 50 -20 65 Q 0 40 0 25 Z" fill="url(#purplePink)"/>
      <path d="M -15 35 Q -15 65 15 55 Q 20 35 5 20 Z" fill="url(#pinkRed)"/>
    </g>

    <!-- نص MY HD -->
    <text x="60" y="130" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="55" fill="url(#logoText)" text-anchor="middle" letter-spacing="1">MY HD</text>

    <!-- النص العربي الرئيسي -->
    <text x="0" y="200" font-family="Tahoma, Arial, sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="start">متعة المشاهدة</text>
    <text x="0" y="240" font-family="Tahoma, Arial, sans-serif" font-weight="900" font-size="32" fill="url(#pinkRed)" text-anchor="start">بجودة لا تضاهى</text>

    <!-- المربعات الأربعة -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="280" height="50" rx="10" fill="#1a0a2e" stroke="#8A2BE2" stroke-width="1"/>
      <rect x="15" y="12" width="25" height="20" rx="3" fill="none" stroke="url(#purplePink)" stroke-width="2"/>
      <path d="M 20 8 L 35 8 M 22 35 L 33 35" stroke="url(#purplePink)" stroke-width="2"/>
      <text x="55" y="20" font-family="Tahoma" font-weight="bold" font-size="14" fill="#fff">قنوات متنوعة</text>
      <text x="55" y="38" font-family="Tahoma" font-size="10" fill="#aaa">محلية وعالمية</text>
    </g>

    <g transform="translate(0, 330)">
      <rect x="0" y="0" width="280" height="50" rx="10" fill="#1a0a2e" stroke="#8A2BE2" stroke-width="1"/>
      <rect x="15" y="12" width="25" height="20" rx="3" fill="none" stroke="url(#purplePink)" stroke-width="2"/>
      <text x="20" y="28" font-family="Arial" font-size="10" font-weight="bold" fill="url(#purplePink)">HD</text>
      <text x="55" y="20" font-family="Tahoma" font-weight="bold" font-size="14" fill="#fff">جودة عالية</text>
      <text x="55" y="38" font-family="Tahoma" font-size="10" fill="#aaa">صوت وصورة فائقة</text>
    </g>

    <g transform="translate(0, 390)">
      <rect x="0" y="0" width="280" height="50" rx="10" fill="#1a0a2e" stroke="#8A2BE2" stroke-width="1"/>
      <circle cx="27" cy="25" r="10" fill="none" stroke="url(#purplePink)" stroke-width="2"/>
      <path d="M 24 21 L 31 25 L 24 29 Z" fill="url(#purplePink)"/>
      <text x="55" y="20" font-family="Tahoma" font-weight="bold" font-size="14" fill="#fff">محتوى مميز</text>
      <text x="55" y="38" font-family="Tahoma" font-size="10" fill="#aaa">أفلام، مسلسلات، برامج</text>
    </g>

    <g transform="translate(0, 450)">
      <rect x="0" y="0" width="280" height="50" rx="10" fill="#1a0a2e" stroke="#8A2BE2" stroke-width="1"/>
      <rect x="15" y="12" width="12" height="20" rx="2" fill="none" stroke="url(#purplePink)" stroke-width="1.5"/>
      <rect x="22" y="20" width="10" height="12" rx="2" fill="none" stroke="url(#purplePink)" stroke-width="1.5"/>
      <text x="55" y="20" font-family="Tahoma" font-weight="bold" font-size="14" fill="#fff">متوافق مع جميع الأجهزة</text>
      <text x="55" y="38" font-family="Tahoma" font-size="10" fill="#aaa">Android - iOS - Smart TV</text>
    </g>
  </g>

  <!-- ================= الجزء العلوي الأيمن: التلفاز والرسيفر ================= -->
  <g transform="translate(340, 50)" filter="url(#boxShadow)">
    <!-- إطار التلفاز -->
    <rect x="0" y="0" width="600" height="400" rx="10" fill="#111" stroke="#333" stroke-width="5"/>
    
    <!-- شاشة التلفاز -->
    <rect x="5" y="5" width="590" height="390" fill="#0a0514"/>
    
    <!-- شريط القوائم -->
    <rect x="5" y="5" width="590" height="40" fill="#111"/>
    <text x="250" y="30" font-family="Tahoma" font-size="16" fill="#aaa">برامج   مسلسلات   أفلام   مباشر</text>
    <circle cx="560" cy="25" r="8" fill="none" stroke="#fff" stroke-width="2"/>
    
    <!-- محتوى الشاشة -->
    <rect x="20" y="60" width="130" height="260" rx="10" fill="#2a0a4a" stroke="#555" stroke-width="2"/>
    <text x="85" y="200" font-family="Tahoma" font-size="20" fill="#fff" text-anchor="middle">LIVE TV</text>
    
    <rect x="165" y="60" width="130" height="260" rx="10" fill="#3a0a2a" stroke="#555" stroke-width="2"/>
    <text x="230" y="200" font-family="Tahoma" font-size="20" fill="#fff" text-anchor="middle">مسلسلات</text>
    
    <rect x="310" y="60" width="130" height="260" rx="10" fill="#1a0a3a" stroke="#555" stroke-width="2"/>
    <text x="375" y="200" font-family="Tahoma" font-size="20" fill="#fff" text-anchor="middle">أفلام</text>
    
    <rect x="455" y="60" width="130" height="260" rx="10" fill="#0a1a3a" stroke="#555" stroke-width="2"/>
    <text x="520" y="200" font-family="Tahoma" font-size="20" fill="#fff" text-anchor="middle">برامج</text>

    <!-- حامل التلفاز -->
    <path d="M 220 400 L 200 440 L 400 440 L 380 400 Z" fill="#111"/>

    <!-- الرسيفر -->
    <rect x="60" y="460" width="350" height="80" rx="10" fill="#111" stroke="#333" stroke-width="2"/>
    <text x="235" y="510" font-family="Arial" font-weight="bold" font-size="30" fill="url(#logoText)" text-anchor="middle">MY HD</text>
    <circle cx="380" cy="520" r="5" fill="#00BFFF" filter="url(#glow)"/>

    <!-- الريموت -->
    <rect x="460" y="430" width="50" height="150" rx="10" fill="#111" stroke="#333" stroke-width="2"/>
    <circle cx="485" cy="455" r="8" fill="#FF0000"/>
    <circle cx="485" cy="490" r="12" fill="#333"/>
  </g>

  <!-- ================= الجزء السفلي: التواصل والاشتراك ================= -->
  
  <!-- مربع التواصل -->
  <g transform="translate(50, 600)">
    <rect x="0" y="0" width="400" height="90" rx="15" fill="#111" stroke="#333" stroke-width="2"/>
    <circle cx="50" cy="45" r="30" fill="url(#purplePink)"/>
    <path d="M 40 30 Q 50 25 55 35 L 50 40 Q 45 35 40 40 Z" fill="#fff"/>
    <path d="M 45 50 Q 55 55 60 45 L 55 40 Q 50 45 45 40 Z" fill="#fff"/>
    
    <text x="100" y="35" font-family="Tahoma" font-size="16" fill="#aaa">تواصل معنا</text>
    <text x="100" y="70" font-family="Arial" font-weight="bold" font-size="30" fill="#fff">+963991936353</text>
  </g>

  <!-- زر الاشتراك -->
  <g transform="translate(500, 600)">
    <rect x="0" y="0" width="450" height="90" rx="15" fill="url(#pinkRed)" filter="url(#glow)"/>
    <text x="200" y="55" font-family="Tahoma" font-weight="bold" font-size="36" fill="#fff" text-anchor="middle">اشترك الآن</text>
    <path d="M 380 35 L 400 45 L 380 55 Z" fill="#fff"/>
  </g>

  <!-- ================= الميزات الصغيرة (أسفل الصفحة) ================= -->
  <g transform="translate(50, 720)">
    <rect x="0" y="0" width="900" height="60" rx="10" fill="#111" stroke="#333" stroke-width="1"/>
    
    <g transform="translate(40, 10)">
      <path d="M 15 5 L 30 0 L 45 5 L 45 25 Q 30 40 15 25 Z" fill="none" stroke="url(#purplePink)" stroke-width="2"/>
      <text x="60" y="20" font-family="Tahoma" font-weight="bold" font-size="14" fill="#fff">خدمة موثوقة</text>
      <text x="60" y="38" font-family="Tahoma" font-size="11" fill="#aaa">ودعم مستمر</text>
    </g>
    
    <line x1="250" y1="10" x2="250" y2="50" stroke="#333" stroke-width="1"/>

    <g transform="translate(290, 10)">
      <path d="M 15 30 L 15 15 Q 15 5 30 5 Q 45 5 45 15 L 45 30" fill="none" stroke="url(#purplePink)" stroke-width="2"/>
      <rect x="10" y="20" width="10" height="15" rx="3" fill="url(#purplePink)"/>
      <rect x="40" y="20" width="10" height="15" rx="3" fill="url(#purplePink)"/>
      <text x="60" y="20" font-family="Tahoma" font-weight="bold" font-size="14" fill="#fff">دعم فني</text>
      <text x="60" y="38" font-family="Tahoma" font-size="11" fill="#aaa">على مدار الساعة</text>
    </g>

    <line x1="480" y1="10" x2="480" y2="50" stroke="#333" stroke-width="1"/>

    <g transform="translate(520, 10)">
      <path d="M 20 5 L 30 15 L 20 25 L 25 15 Z" fill="url(#purplePink)"/>
      <path d="M 35 5 L 25 15 L 35 25 L 30 15 Z" fill="url(#purplePink)"/>
      <text x="50" y="20" font-family="Tahoma" font-weight="bold" font-size="14" fill="#fff">تحديثات مستمرة</text>
      <text x="50" y="38" font-family="Tahoma" font-size="11" fill="#aaa">وأداء مستقر</text>
    </g>

    <line x1="700" y1="10" x2="700" y2="50" stroke="#333" stroke-width="1"/>

    <g transform="translate(740, 10)">
      <circle cx="20" cy="20" r="10" fill="none" stroke="url(#purplePink)" stroke-width="2"/>
      <circle cx="35" cy="20" r="10" fill="none" stroke="url(#purplePink)" stroke-width="2"/>
      <circle cx="27" cy="10" r="8" fill="none" stroke="url(#purplePink)" stroke-width="2"/>
      <text x="55" y="20" font-family="Tahoma" font-weight="bold" font-size="14" fill="#fff">آلاف</text>
      <text x="55" y="38" font-family="Tahoma" font-size="11" fill="#aaa">المشتركين</text>
    </g>
  </g>
</svg>
