<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- تدرجات لونية -->
    <linearGradient id="bgGrad" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#1a1508"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffea7c"/>
      <stop offset="50%" stop-color="#e6b325"/>
      <stop offset="100%" stop-color="#b57e10"/>
    </linearGradient>
    <linearGradient id="silverGrad" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
    <linearGradient id="screenGrad" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a5a8a"/>
      <stop offset="100%" stop-color="#0f2b45"/>
    </linearGradient>
    <linearGradient id="btnGrad" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6b325"/>
      <stop offset="100%" stop-color="#ffea7c"/>
    </linearGradient>
    
    <!-- توهج -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- الخلفية -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  
  <!-- خطوط ضوئية ذهبية بالخلفية -->
  <path d="M 0 100 L 1200 300 M 0 400 L 1200 600 M 0 700 L 1200 900" stroke="#e6b325" stroke-width="2" opacity="0.1" />
  <path d="M 200 0 L 400 800 M 800 0 L 1000 800" stroke="#e6b325" stroke-width="3" opacity="0.05" />

  <!-- القسم الأيسر: النصوص والشعار -->
  <g transform="translate(50, 80)">
    <!-- شعار MY HD -->
    <text x="0" y="80" font-family="Arial, sans-serif" font-weight="900" font-size="110" fill="url(#silverGrad)" letter-spacing="-2">MY</text>
    <text x="220" y="80" font-family="Arial, sans-serif" font-weight="900" font-size="110" fill="url(#goldGrad)" letter-spacing="-2">HD</text>
    
    <!-- شريط IPTV -->
    <rect x="180" y="110" width="280" height="50" rx="25" fill="url(#goldGrad)"/>
    <text x="320" y="147" font-family="Arial, sans-serif" font-weight="bold" font-size="40" fill="#000" text-anchor="middle">IPTV</text>

    <!-- النص العربي: مشاهدة بلا حدود -->
    <text x="0" y="230" font-family="Tahoma, Arial, sans-serif" font-weight="bold" font-size="60" fill="#ffffff">مشاهدة بلا حدود</text>
    
    <!-- شريط النص العربي: كل القنوات.. كل الدول -->
    <rect x="0" y="260" width="520" height="60" rx="30" fill="url(#goldGrad)"/>
    <text x="260" y="302" font-family="Tahoma, Arial, sans-serif" font-weight="bold" font-size="32" fill="#000" text-anchor="middle">كل القنوات .. كل الدول</text>

    <!-- أيقونات دائرية (4 أيقونات) -->
    <!-- 1. رياضة -->
    <g transform="translate(60, 360)">
      <circle cx="0" cy="0" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
      <rect x="-15" y="-10" width="30" height="20" rx="3" fill="url(#goldGrad)"/>
      <path d="M -15 -10 L 15 -10 M -15 10 L 15 10" stroke="#000" stroke-width="2"/>
      <text x="0" y="75" font-family="Tahoma" font-weight="bold" font-size="20" fill="#fff" text-anchor="middle">قنوات رياضية</text>
    </g>
    
    <!-- 2. أفلام -->
    <g transform="translate(180, 360)">
      <circle cx="0" cy="0" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
      <path d="M -20 -10 L 20 -10 L 20 15 L -20 15 Z" fill="url(#goldGrad)"/>
      <path d="M -20 -10 L -10 -20 M 0 -10 L 10 -20 M 20 -10 L 30 -20" stroke="url(#goldGrad)" stroke-width="3"/>
      <text x="0" y="75" font-family="Tahoma" font-weight="bold" font-size="20" fill="#fff" text-anchor="middle">أفلام ومسلسلات</text>
    </g>

    <!-- 3. أطفال -->
    <g transform="translate(300, 360)">
      <circle cx="0" cy="0" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
      <circle cx="-10" cy="-5" r="12" fill="url(#goldGrad)"/>
      <circle cx="15" cy="10" r="8" fill="url(#goldGrad)"/>
      <text x="0" y="75" font-family="Tahoma" font-weight="bold" font-size="20" fill="#fff" text-anchor="middle">قنوات الأطفال</text>
    </g>

    <!-- 4. عالمية -->
    <g transform="translate(420, 360)">
      <circle cx="0" cy="0" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
      <circle cx="0" cy="0" r="25" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
      <path d="M -25 0 L 25 0 M 0 -25 L 0 25 M -18 -18 L 18 18 M -18 18 L 18 -18" stroke="url(#goldGrad)" stroke-width="2"/>
      <text x="0" y="75" font-family="Tahoma" font-weight="bold" font-size="20" fill="#fff" text-anchor="middle">قنوات عالمية</text>
    </g>

    <!-- الميزات السفلية (3 كبسولات) -->
    <!-- جودة عالية -->
    <g transform="translate(30, 480)">
      <rect x="0" y="0" width="160" height="50" rx="25" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
      <path d="M 20 25 L 40 10 L 40 20 L 60 5 L 50 25 L 40 25 L 40 30 Z" fill="url(#goldGrad)"/>
      <text x="85" y="32" font-family="Tahoma" font-weight="bold" font-size="18" fill="#fff" text-anchor="middle">جودة عالية</text>
      <text x="85" y="46" font-family="Tahoma" font-size="12" fill="#ccc" text-anchor="middle">HD / FHD / 4K</text>
    </g>

    <!-- استقرار -->
    <g transform="translate(200, 480)">
      <rect x="0" y="0" width="160" height="50" rx="25" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
      <circle cx="30" cy="25" r="15" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
      <path d="M 30 10 A 15 15 0 0 0 30 40 M 30 25 L 40 15" stroke="url(#goldGrad)" stroke-width="3" fill="none"/>
      <text x="85" y="32" font-family="Tahoma" font-weight="bold" font-size="18" fill="#fff" text-anchor="middle">استقرار وسرعة</text>
    </g>

    <!-- دعم فني -->
    <g transform="translate(370, 480)">
      <rect x="0" y="0" width="160" height="50" rx="25" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
      <path d="M 20 25 Q 20 15 30 15 Q 40 15 40 25" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
      <path d="M 15 25 L 15 35 Q 15 40 20 40 L 25 40" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
      <text x="85" y="32" font-family="Tahoma" font-weight="bold" font-size="18" fill="#fff" text-anchor="middle">دعم فني مستمر</text>
    </g>

    <!-- زر اشترك الآن -->
    <g transform="translate(50, 580)">
      <rect x="0" y="0" width="350" height="80" rx="40" fill="url(#goldGrad)" filter="url(#glow)"/>
      <path d="M 30 40 L 50 20 L 70 40 M 30 40 L 50 60 L 70 40" stroke="#000" stroke-width="4" fill="none"/>
      <text x="200" y="52" font-family="Tahoma" font-weight="bold" font-size="36" fill="#000" text-anchor="middle">اشترك الآن</text>
      <path d="M 320 40 L 340 20 L 340 60 Z" fill="#000"/>
    </g>
  </g>

  <!-- القسم الأيمن: الشاشة والرسيفر -->
  <g transform="translate(650, 100)">
    <!-- الشاشة (تلفاز) -->
    <rect x="0" y="0" width="500" height="300" rx="10" fill="#111" stroke="#333" stroke-width="8"/>
    
    <!-- محتوى الشاشة (محاكاة مباراة كرة قدم) -->
    <rect x="8" y="8" width="484" height="284" fill="url(#screenGrad)"/>
    <rect x="8" y="180" width="484" height="112" fill="#1a4a1a"/> <!-- العشب -->
    <path d="M 8 180 Q 250 100 492 180" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
    
    <!-- لاعبين مبسطين -->
    <circle cx="150" cy="140" r="15" fill="#fff"/>
    <path d="M 135 155 L 120 200 L 150 210 L 165 180 L 180 210 L 195 200 L 170 155 Z" fill="#fff"/>
    
    <circle cx="350" cy="130" r="15" fill="#fff"/>
    <path d="M 335 145 L 320 190 L 350 200 L 365 170 L 380 200 L 395 190 L 370 145 Z" fill="#fff"/>
    
    <!-- الكرة -->
    <circle cx="250" cy="220" r="15" fill="#fff" stroke="#000" stroke-width="2"/>

    <!-- شاشات صغيرة خلفية (أفلام وكرتون) -->
    <g transform="translate(50, -80)">
      <rect x="0" y="0" width="120" height="70" rx="5" fill="#2a1a2a" stroke="#555" stroke-width="3"/>
      <rect x="130" y="0" width="120" height="70" rx="5" fill="#1a2a3a" stroke="#555" stroke-width="3"/>
      <rect x="260" y="0" width="120" height="70" rx="5" fill="#3a2a1a" stroke="#555" stroke-width="3"/>
      <rect x="390" y="0" width="120" height="70" rx="5" fill="#1a3a1a" stroke="#555" stroke-width="3"/>
    </g>

    <!-- حامل التلفاز -->
    <path d="M 200 308 L 180 340 L 320 340 L 300 308 Z" fill="#222"/>

    <!-- الرسيفر -->
    <g transform="translate(50, 380)">
      <rect x="0" y="0" width="300" height="90" rx="15" fill="#111" stroke="#333" stroke-width="4"/>
      <rect x="10" y="10" width="280" height="70" rx="10" fill="#1a1a1a"/>
      <!-- شعار MY HD على الرسيفر -->
      <text x="150" y="50" font-family="Arial" font-weight="bold" font-size="24" fill="url(#goldGrad)" text-anchor="middle">▶ MY HD</text>
    </g>

    <!-- الريموت كنترول -->
    <g transform="translate(380, 320)">
      <rect x="0" y="0" width="60" height="200" rx="15" fill="#111" stroke="#333" stroke-width="3"/>
      <circle cx="30" cy="30" r="10" fill="#d00"/>
      <rect x="15" y="60" width="30" height="20" rx="5" fill="#333"/>
      <circle cx="30" cy="110" r="20" fill="#333"/>
      <text x="30" y="115" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle">OK</text>
      <rect x="15" y="150" width="30" height="10" rx="3" fill="#333"/>
      <rect x="15" y="170" width="30" height="10" rx="3" fill="#333"/>
    </g>
  </g>

  <!-- النص السفلي -->
  <text x="600" y="760" font-family="Tahoma, Arial, sans-serif" font-weight="bold" font-size="32" fill="url(#goldGrad)" text-anchor="middle">مع MY HD .. الترفيه بلا حدود</text>
</svg>
