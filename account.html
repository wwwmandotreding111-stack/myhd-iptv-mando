<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>السلة وإتمام الطلب | MYHD IPTV MANDO</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="auth-page"><a class="brand auth-brand" href="index.html"><span class="brand-mark">M</span><span>MYHD <b>IPTV</b><small>MANDO</small></span></a>
<main class="auth-card checkout-card"><span class="eyebrow">سلة مشترياتك</span><h1>راجع طلبك وأكمله</h1><p class="muted">يمكنك جمع أكثر من باقة في طلب واحد. راجع اختياراتك ثم أدخل معلومات التواصل.</p>
<section class="selected-plan-card"><div class="cart-heading"><small>الباقات المختارة</small><a class="back-link" href="index.html#plans">＋ إضافة باقات</a></div><div id="cartItems"><p class="muted">جارٍ تحميل السلة...</p></div><div class="cart-total"><span>المجموع</span><strong id="cartTotal">—</strong></div></section>
<form id="checkoutForm"><label for="customerName">الاسم الكامل</label><input id="customerName" autocomplete="name" required maxlength="100" placeholder="اكتب اسمك"><label for="customerPhone">رقم الهاتف</label><input id="customerPhone" type="tel" autocomplete="tel" required maxlength="30" placeholder="رقمك مع رمز الدولة"><label for="orderNotes">ملاحظات (اختياري)</label><textarea id="orderNotes" rows="3" maxlength="500" placeholder="أي ملاحظة حول طلبك"></textarea><button class="btn btn-gold full" id="sendOrderBtn" type="submit">أتمم طلبك عبر واتساب</button></form>
<p id="orderMessage" class="message" role="status"></p><p class="muted small-note">لن يتم تفعيل الاشتراك إلا بعد مراجعة الطلب وتأكيده من الإدارة.</p><a class="back-link" href="index.html">العودة إلى الباقات</a></main>
<script src="config.js"></script><script src="account.js"></script></body></html>
